[project]
name = "sic"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Amont Labs", email = "hello@amontlabs.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "soundfile>=0.14.0",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint.per-file-ignores]
# Fault isolation is deliberate at these boundaries: one failing claim/tool/connector must never
# take down the live feed, so broad exceptions are caught and surfaced as data.
"src/sic/{live,verify,server}.py" = ["BLE001"]
"src/sic/sources/{__init__,web}.py" = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
